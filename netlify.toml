# Netlify: publica la carpeta floreria. La tienda es 100 % estática: los pedidos, el stock y
# Mercado Pago los maneja el script de la planilla de Google (backend/florlatte-apps-script.gs).
[build]
  publish = "floreria"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
